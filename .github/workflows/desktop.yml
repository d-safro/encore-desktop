# Builds the desktop apps: Linux (archive, RPM, .deb, Arch package, Flatpak) and Windows (setup program,
# portable zip). Each package is installed in a clean container and started with --version before anything is
# attached. Pushing a v* tag attaches the files to that release (made as a draft if it isn't there yet);
# a ci-* tag, or running it by hand ("Run workflow"), only builds them, as downloadable artifacts.
# Once a week only the Flatpak is built, from the latest release's archive: that keeps flatpak-builder's cache
# (libmpv and the rest) on main, where tag runs can use it (a cache made by one tag run can't be used by another,
# and one nobody uses for 7 days is deleted).
name: Desktop builds
on:
  push:
    tags: ['v*', 'ci-*']
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: write

# ════ THE SWITCH ════ 'true': releases are also attached to d-safro/encore, where desktop copies up to
# 1.9.x look for updates (see the last step). Set it to 'false' when those have all updated.
env:
  ATTACH_TO_PHONE_REPO: 'false'  # 1.10.0: attached to d-safro/encore by hand (no PHONE_REPO_TOKEN secret yet); 'true' once it's added

jobs:
  linux:
    # Built here, the programs can need a C library as new as this machine's (glibc 2.39): the .deb asks for
    # the newest one they use (tools/debian/build-deb.sh), so it's for Debian 13+ and Ubuntu 24.04+.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libsecret-1-dev \
            libayatana-appindicator3-dev lld liblzma-dev rpm librsvg2-bin
      - run: flutter pub get
      - name: Archive, RPM, .deb and Arch package
        run: tools/linux/build.sh --deb --arch
      - name: The .deb installs and starts on Debian
        run: |
          docker run --rm -v "$PWD/dist:/dist" debian:stable-slim bash -c '
            apt-get update -qq && apt-get install -y -qq /dist/encore_*.deb >/dev/null && encore --version'
      - name: The Arch package installs and starts on Arch
        run: |
          docker run --rm -v "$PWD/dist:/dist" archlinux:latest bash -c '
            pacman -Syu --noconfirm -q >/dev/null && pacman -U --noconfirm /dist/encore-bin-*.pkg.tar.zst >/dev/null && encore --version'
      - name: The RPM installs and starts on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist" fedora:latest bash -c '
            dnf install -y -q /dist/encore-*.rpm >/dev/null && encore --version'
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/PKGBUILD

  windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: flutter pub get
      - name: Setup program and portable zip
        shell: pwsh
        run: tools\windows\build.ps1
      - name: The setup program installs quietly and Encore starts
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup failed ($($p.ExitCode))" }
          $exe = "$env:LOCALAPPDATA\Programs\Encore\encore.exe"
          $p = Start-Process $exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "encore.exe --version failed ($($p.ExitCode))" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Encore\unins000.exe")) { throw 'no uninstaller: updates would not work' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  flatpak:
    # From the Linux job's archive (the one the release ships), with tools/flatpak/build.sh, in Flathub's builder
    # image: flatpak-builder and the GNOME 51 SDK are in it, and privileged, its sandbox (bubblewrap) works.
    needs: linux
    if: ${{ !cancelled() && (needs.linux.result == 'success' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: github.event_name != 'schedule'
        with:
          name: linux
          path: linux
      - name: The latest release's archive (weekly run)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
            | grep -o '"browser_download_url": *"[^"]*-linux-x86_64\.tar\.gz"' | cut -d'"' -f4)
          mkdir -p linux && curl -fsSL -o "linux/${url##*/}" "$url"
      # flatpak-builder's state (downloads and built modules), so libmpv, libplacebo and the rest are only built
      # again when they change. The key is the SDK and the manifest without Encore's module: Encore is built
      # again every time anyway (build.sh puts the archive's checksum in the manifest).
      - name: The key for flatpak-builder's cache
        id: cache-key
        run: |
          sdk=$(flatpak info --show-commit org.gnome.Sdk//51 | cut -c1-12)
          modules=$({ sed '/^  - name: encore$/,$d' tools/flatpak/dev.safro.encore.yml
            find tools/flatpak/shared-modules -type f -print0 | sort -z | xargs -0 cat; } | sha256sum | cut -c1-16)
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "key=flatpak-builder-$sdk-$modules" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: build/flatpak/state
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            flatpak-builder-${{ steps.cache-key.outputs.sdk }}-
            flatpak-builder-
      - name: Flatpak
        run: |
          archive=$(ls linux/encore-*-linux-x86_64.tar.gz)
          tools/flatpak/build.sh "$archive"
      - name: The Flatpak installs and starts
        run: |
          archive=$(ls linux/encore-*-linux-x86_64.tar.gz)
          version=${archive#linux/encore-}; version=${version%-linux-x86_64.tar.gz}
          flatpak install --user -y --noninteractive dist/encore-*-x86_64.flatpak
          out=$(dbus-run-session -- flatpak run --no-a11y-bus dev.safro.encore --version)
          echo "$out"
          case "$out" in "Encore $version" | "Encore $version+"*) ;; *) echo "not Encore $version"; exit 1 ;; esac
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule'
        with:
          name: flatpak
          path: dist/*.flatpak

  attach:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/upload.sh "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.rpm dist/*.deb dist/*.pkg.tar.zst dist/PKGBUILD dist/*.flatpak dist/*.exe dist/*.zip

      # ── For desktop copies up to 1.9.x (they look for updates in d-safro/encore) ──
      # The same files also go on d-safro/encore's release of the same version (a draft until the phone's
      # release is published), and its SHA256SUMS.txt keeps the lines of both apps. Needs the secret
      # PHONE_REPO_TOKEN: a fine-grained token with Contents: read and write on d-safro/encore.
      # To stop once no 1.9.x desktop copies are left: set ATTACH_TO_PHONE_REPO to 'false' at the top.
      - name: Also attach to d-safro/encore (desktop copies up to 1.9.x update from there)
        if: env.ATTACH_TO_PHONE_REPO == 'true'
        env:
          GH_TOKEN: ${{ secrets.PHONE_REPO_TOKEN }}
          GH_REPO: d-safro/encore
        run: tools/release/upload.sh "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.rpm dist/*.deb dist/*.pkg.tar.zst dist/PKGBUILD dist/*.flatpak dist/*.exe dist/*.zip
